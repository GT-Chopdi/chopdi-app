analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by build_runner. Isar's generator emits helpers built on APIs it
    # marks experimental, so linting this code produces dozens of warnings that
    # no one can act on — and which drown the ones that matter.
    - "**/*.g.dart"
    # Command-line diagnostics; printing to stdout is the point.
    - "tool/**"
