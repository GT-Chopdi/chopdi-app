name: mychopdi
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.1
  country_code_picker: ^3.4.1
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_contacts: ^2.3.1
  flutter_dotenv: ^6.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  gap: ^3.0.1
  google_fonts: ^8.1.0
  intl: ^0.20.3
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  pinput: ^6.0.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_community_generator: 3.3.2

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/app_logo.png"

  adaptive_icon_foreground: "assets/app_logo.png"
